<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universal Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070914; --ink:#e9ecff; --dim:#8d93b8;
  --cyan:#5ee7ff; --violet:#8b5cf6; --rose:#ff6ba8;
  --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.14);
  --font:"Sora","Hind Siliguri",system-ui,sans-serif;
  --bn:"Hind Siliguri","Sora",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);overflow:hidden;
  background-image:
    radial-gradient(60vmax 40vmax at 15% 0%,rgba(139,92,246,.28),transparent 60%),
    radial-gradient(50vmax 40vmax at 90% 100%,rgba(94,231,255,.22),transparent 60%);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* Splash */
#splash{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:34px;
  background:rgba(7,9,20,.72);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);
  transition:opacity .7s ease,visibility .7s;
}
#splash.hide{opacity:0;visibility:hidden}
.orb{
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,var(--cyan) 30%,var(--violet) 75%);
  box-shadow:0 0 40px 10px rgba(94,231,255,.55),0 0 120px 40px rgba(139,92,246,.45);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 60px 18px rgba(94,231,255,.7),0 0 160px 60px rgba(139,92,246,.55)}}
.init{letter-spacing:.04em;font-weight:600;color:var(--dim);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}

/* Layout */
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:10px;max-width:760px;margin:0 auto}
.panel{
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"head mic" "live mic";gap:6px 14px;align-items:center;
  padding:14px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.panel.fr{--c:var(--rose)} .panel.bn{--c:var(--cyan)}
.head{grid-area:head;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-weight:700;font-size:15px}
.bn .who{font-family:var(--bn);font-size:17px}
select{
  background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;padding:8px 12px;cursor:pointer;
}
select option{background:#12152b;color:var(--ink)}
.live{grid-area:live;min-height:22px;font-size:14px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn .live{font-family:var(--bn);font-size:16px}
.panel[data-state=listening] .live{color:var(--c)}

/* Mic */
.mic{
  grid-area:mic;position:relative;width:72px;height:72px;border-radius:50%;border:1px solid var(--edge);cursor:pointer;
  display:grid;place-items:center;color:#07101a;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c));
  box-shadow:0 0 28px -4px var(--c);transition:transform .15s,opacity .2s;
}
.mic:active{transform:scale(.94)}
.mic svg{width:30px;height:30px;position:relative}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0}
.panel[data-state=listening] .mic::before{animation:ring 1.5s ease-out infinite}
.panel[data-state=listening] .mic::after{animation:ring 1.5s ease-out .75s infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}
body[data-busy=other] .panel:not([data-state=listening]) .mic{opacity:.35;pointer-events:none}
body[data-busy=other] .panel:not([data-state=listening]) .mic{filter:grayscale(.6)}

/* Chat */
#chat{
  overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  border-radius:24px;border:1px solid var(--edge);background:rgba(255,255,255,.03);padding:14px;
}
.empty{margin:auto;text-align:center;color:var(--dim);font-size:14px;line-height:1.7;max-width:26ch}
.msg{max-width:86%;padding:12px 14px;border-radius:20px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.bn{align-self:flex-end;border-bottom-right-radius:6px;border-color:rgba(94,231,255,.4);background:linear-gradient(135deg,rgba(94,231,255,.14),rgba(94,231,255,.04))}
.msg.fr{align-self:flex-start;border-bottom-left-radius:6px;border-color:rgba(255,107,168,.4);background:linear-gradient(135deg,rgba(255,107,168,.14),rgba(255,107,168,.04))}
.orig{font-size:13px;color:var(--dim);margin-bottom:6px}
.msg.bn .orig{font-family:var(--bn);font-size:15px}
.tr{font-size:16px;font-weight:600;line-height:1.5;display:flex;align-items:center;gap:8px}
.tr[dir=rtl]{text-align:right}
.msg.fr .tr{font-family:var(--bn)}
.msg.fr .tr[data-from-bn]{font-family:var(--font)}
.msg .play{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center}
.play svg{width:14px;height:14px}
.err{color:#ffb4b4;font-size:14px;font-weight:400}

/* Translating state */
.wait{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-right-color:var(--violet);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.shimmer{height:10px;width:140px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.28),rgba(255,255,255,.06));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}


/* Premium layer */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(30vmax 30vmax at 20% 30%,rgba(139,92,246,.25),transparent 70%),radial-gradient(28vmax 28vmax at 80% 70%,rgba(94,231,255,.2),transparent 70%),radial-gradient(22vmax 22vmax at 60% 10%,rgba(255,107,168,.14),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.1)}}
.bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transform-origin:left;animation:load 2.5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{from{transform:scaleX(0)}}
.lbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:8px 14px;cursor:pointer;transition:.2s}
.lbtn:hover{border-color:var(--c);box-shadow:0 0 18px -6px var(--c)}
.fl{font-size:20px;line-height:1}
.wave{display:none;align-items:center;gap:3px;height:20px;margin-left:auto}
.panel[data-state=listening] .wave{display:flex}
.wave i{width:3px;height:100%;border-radius:2px;background:var(--c);animation:eq 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.panel[data-state=listening]{border-color:var(--c);box-shadow:0 0 40px -14px var(--c)}
.chip{font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.02em}
.msg{box-shadow:0 10px 30px -18px #000}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(3,4,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.25s}
.sheet-bg.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;z-index:31;max-height:78dvh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:rgba(14,17,36,.88);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--edge);border-bottom:0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;margin-bottom:10px}
.lgrid{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lgrid button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.05);cursor:pointer;transition:.15s}
.lgrid button:hover,.lgrid button[aria-current=true]{border-color:var(--rose);background:rgba(255,107,168,.12)}
.lgrid .fl{font-size:24px}
.lgrid small{display:block;color:var(--dim);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;z-index:40;
  background:rgba(20,24,48,.92);border:1px solid var(--edge);padding:10px 16px;border-radius:14px;font-size:13px;transition:.3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:640px){.panel{padding:10px 14px}.mic{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <div class="orb"></div>
  <p class="init">AI Translator Initializing...</p>
  <div class="bar"><i></i></div>
</div>

<main id="app">
  <section class="panel fr" id="panel-fr" data-state="idle">
    <div class="head">
      <span class="who">Foreigner</span>
      <button class="lbtn" id="langBtn" aria-label="Choose foreigner’s language"></button>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="live" id="live-fr">Tap the mic and speak</div>
    <button class="mic" id="mic-fr" aria-label="Foreigner microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </section>

  <section id="chat" aria-live="polite">
    <p class="empty" id="empty">Your conversation will appear here, with every message translated both ways.</p>
  </section>

  <section class="panel bn" id="panel-bn" data-state="idle">
    <div class="head"><span class="who">বাংলা (Bangla)</span><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="live" id="live-bn">মাইক চাপুন ও বলুন</div>
    <button class="mic" id="mic-bn" aria-label="Bangla microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </section>
</main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Choose language">
  <input id="lq" type="search" placeholder="Search language…" aria-label="Search language" autocomplete="off">
  <div class="lgrid" id="lgrid"></div>
</div>
<div id="toast"></div>

<script>
/* ====== CONFIG ====== */
const API_URL = "https://translator.akijelectronic.workers.dev/api/translate";
const TIMEOUT_MS = 20000;

const L = [
["en","English","English","en-US","🇺🇸"],["ar","Arabic","العربية","ar-SA","🇸🇦",1],["ms","Malay","Bahasa Melayu","ms-MY","🇲🇾"],
["it","Italian","Italiano","it-IT","🇮🇹"],["ko","Korean","한국어","ko-KR","🇰🇷"],["hi","Hindi","हिन्दी","hi-IN","🇮🇳"],
["ur","Urdu","اردو","ur-PK","🇵🇰",1],["ta","Tamil","தமிழ்","ta-IN","🇮🇳"],["te","Telugu","తెలుగు","te-IN","🇮🇳"],
["mr","Marathi","मराठी","mr-IN","🇮🇳"],["gu","Gujarati","ગુજરાતી","gu-IN","🇮🇳"],["kn","Kannada","ಕನ್ನಡ","kn-IN","🇮🇳"],
["ml","Malayalam","മലയാളം","ml-IN","🇮🇳"],["pa","Punjabi","ਪੰਜਾਬੀ","pa-IN","🇮🇳"],["ne","Nepali","नेपाली","ne-NP","🇳🇵"],
["si","Sinhala","සිංහල","si-LK","🇱🇰"],["zh","Chinese (Mandarin)","中文","zh-CN","🇨🇳"],["yue","Cantonese","粵語","zh-HK","🇭🇰"],
["ja","Japanese","日本語","ja-JP","🇯🇵"],["th","Thai","ไทย","th-TH","🇹🇭"],["vi","Vietnamese","Tiếng Việt","vi-VN","🇻🇳"],
["id","Indonesian","Bahasa Indonesia","id-ID","🇮🇩"],["fil","Filipino","Filipino","fil-PH","🇵🇭"],["km","Khmer","ភាសាខ្មែរ","km-KH","🇰🇭"],
["my","Burmese","မြန်မာ","my-MM","🇲🇲"],["lo","Lao","ລາວ","lo-LA","🇱🇦"],["mn","Mongolian","Монгол","mn-MN","🇲🇳"],
["kk","Kazakh","Қазақша","kk-KZ","🇰🇿"],["uz","Uzbek","Oʻzbekcha","uz-UZ","🇺🇿"],["fa","Persian","فارسی","fa-IR","🇮🇷",1],
["ps","Pashto","پښتو","ps-AF","🇦🇫",1],["he","Hebrew","עברית","he-IL","🇮🇱",1],["tr","Turkish","Türkçe","tr-TR","🇹🇷"],
["az","Azerbaijani","Azərbaycanca","az-AZ","🇦🇿"],["ka","Georgian","ქართული","ka-GE","🇬🇪"],["hy","Armenian","Հայերեն","hy-AM","🇦🇲"],
["ru","Russian","Русский","ru-RU","🇷🇺"],["uk","Ukrainian","Українська","uk-UA","🇺🇦"],["pl","Polish","Polski","pl-PL","🇵🇱"],
["cs","Czech","Čeština","cs-CZ","🇨🇿"],["sk","Slovak","Slovenčina","sk-SK","🇸🇰"],["hu","Hungarian","Magyar","hu-HU","🇭🇺"],
["ro","Romanian","Română","ro-RO","🇷🇴"],["bg","Bulgarian","Български","bg-BG","🇧🇬"],["sr","Serbian","Српски","sr-RS","🇷🇸"],
["hr","Croatian","Hrvatski","hr-HR","🇭🇷"],["el","Greek","Ελληνικά","el-GR","🇬🇷"],["de","German","Deutsch","de-DE","🇩🇪"],
["fr","French","Français","fr-FR","🇫🇷"],["es","Spanish","Español","es-ES","🇪🇸"],["pt","Portuguese","Português","pt-BR","🇧🇷"],
["nl","Dutch","Nederlands","nl-NL","🇳🇱"],["sv","Swedish","Svenska","sv-SE","🇸🇪"],["no","Norwegian","Norsk","nb-NO","🇳🇴"],
["da","Danish","Dansk","da-DK","🇩🇰"],["fi","Finnish","Suomi","fi-FI","🇫🇮"],["is","Icelandic","Íslenska","is-IS","🇮🇸"],
["ga","Irish","Gaeilge","ga-IE","🇮🇪"],["sw","Swahili","Kiswahili","sw-KE","🇰🇪"],["am","Amharic","አማርኛ","am-ET","🇪🇹"],
["ha","Hausa","Hausa","ha-NG","🇳🇬"],["yo","Yoruba","Yorùbá","yo-NG","🇳🇬"],["zu","Zulu","isiZulu","zu-ZA","🇿🇦"],
["af","Afrikaans","Afrikaans","af-ZA","🇿🇦"],["so","Somali","Soomaali","so-SO","🇸🇴"]
];
const LANGS = {};
L.forEach(([c,name,native,speech,flag,rtl])=>LANGS[c]={name,native,speech,flag,rtl:!!rtl});
LANGS.bn = {name:"Bengali",native:"বাংলা",speech:"bn-BD",flag:"🇧🇩"};
const IDLE = {
  fr:"Tap the mic and speak",
  bn:"মাইক চাপুন ও বলুন"
};

/* ====== SPLASH ====== */
setTimeout(()=>document.getElementById("splash").classList.add("hide"),2500);

/* ====== HELPERS ====== */
const $ = id => document.getElementById(id);
const chat = $("chat");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let active = null;      // {rec, side}
let pending = 0;        // translations in flight

let toastT;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200);
}
function setState(side,state,text){
  $("panel-"+side).dataset.state = state;
  $("live-"+side).textContent = text ?? IDLE[side];
  document.body.dataset.busy = state==="listening" ? "other" : "";
}
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 16 12z"/></svg>';

/* ====== SPEECH OUTPUT ====== */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text, tag){
  if (!("speechSynthesis" in window)) return toast("This browser can’t speak translations aloud.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = tag; u.rate = .95;
  const base = tag.split("-")[0].toLowerCase();
  const v = voices.find(v=>v.lang.toLowerCase()===tag.toLowerCase())
         || voices.find(v=>v.lang.toLowerCase().startsWith(base));
  if (v) u.voice = v;
  else if (voices.length) toast("No "+tag+" voice installed on this device. Install one in system settings.");
  speechSynthesis.speak(u);
}

/* ====== CHAT UI ====== */
function addMessage(side, original, label){
  $("empty")?.remove();
  const m = document.createElement("div");
  m.className = "msg "+side;
  const o = document.createElement("div"); o.className="orig"; o.textContent=original;
  const t = document.createElement("div"); t.className="tr";
  t.innerHTML = '<div class="wait"><div class="spin"></div><span>Translating…</span><div class="shimmer"></div></div>';
  const c = document.createElement("div"); c.className="chip"; c.textContent=label;
  m.append(c,o,t); chat.append(m); scrollDown();
  return t;
}
function fillTranslation(el, text, target){
  el.textContent = "";
  const s = document.createElement("span"); s.textContent = text;
  if (LANGS[target].rtl) el.dir = "rtl";
  if (target !== "bn") el.dataset.fromBn = "1";
  const b = document.createElement("button");
  b.className="play"; b.innerHTML=PLAY_SVG; b.setAttribute("aria-label","Play translation");
  b.onclick = ()=>speak(text, LANGS[target].speech);
  el.append(s,b); scrollDown();
}
function fillError(el, msg){
  el.innerHTML=""; const e=document.createElement("span"); e.className="err"; e.textContent=msg; el.append(e); scrollDown();
}

/* ====== AI BACKEND ====== */
async function translate(side, text){
  const from = side==="bn" ? "bn" : langSel.value;
  const to   = side==="bn" ? langSel.value : "bn";
  const slot = addMessage(side, text, LANGS[from].native+"  →  "+LANGS[to].native);

  if (API_URL.includes("your-worker")) {
    return fillError(slot, "API not connected yet. Set API_URL at the top of the script.");
  }
  pending++;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), TIMEOUT_MS);
  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        text,
        source:from, sourceName:LANGS[from].name,
        target:to,   targetName:LANGS[to].name,
        targetLanguage:LANGS[to].name
      }),
      signal:ctl.signal
    });
    if(!res.ok) throw new Error("Server returned "+res.status);
    const data = await res.json();
    const out = (data.translation ?? data.translatedText ?? data.translated_text ?? data.text ?? "").toString().trim();
    if(!out) throw new Error("Empty translation");
    fillTranslation(slot, out, to);
    speak(out, LANGS[to].speech);
  }catch(err){
    fillError(slot, err.name==="AbortError" ? "Translation timed out. Try again." : "Couldn’t translate: "+err.message);
  }finally{
    clearTimeout(timer); pending--;
  }
}

/* ====== SPEECH INPUT ====== */
function toggleMic(side){
  if(!SR) return toast("Speech recognition isn’t supported here. Use Chrome or Edge.");
  if(active){ if(active.side===side) active.rec.stop(); return; }
  speechSynthesis?.cancel(); navigator.vibrate?.(20);

  const rec = new SR();
  rec.lang = side==="bn" ? LANGS.bn.speech : LANGS[langSel.value].speech;
  rec.interimResults = true; rec.continuous = false;
  let finalT="", interimT="", error="";

  rec.onstart = ()=>setState(side,"listening","Listening…");
  rec.onresult = e=>{
    interimT="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) finalT+=r[0].transcript; else interimT+=r[0].transcript;
    }
    $("live-"+side).textContent = (finalT+interimT) || "Listening…";
  };
  rec.onerror = e=>{ error=e.error; };
  rec.onend = ()=>{
    active=null;
    const text=(finalT||interimT).trim();
    setState(side,"idle");
    if(text) translate(side,text);
    else if(error==="not-allowed") toast("Microphone blocked. Allow access in your browser settings.");
    else if(error && error!=="aborted") toast("Mic error: "+error);
    else toast("Didn’t catch that. Tap the mic and try again.");
  };
  active={rec,side};
  try{ rec.start(); }catch(_){ active=null; }
}
$("mic-fr").onclick = ()=>toggleMic("fr");
$("mic-bn").onclick = ()=>toggleMic("bn");
/* ====== LANGUAGE PICKER ====== */
let current = "en";
try{ const s=localStorage.getItem("lang"); if(s && LANGS[s] && s!=="bn") current=s; }catch(_){}
const langSel = { get value(){ return current; } };
const sheet=$("sheet"), sbg=$("sheetBg"), q=$("lq"), grid=$("lgrid");
function paintBtn(){ const l=LANGS[current]; $("langBtn").innerHTML='<span class="fl">'+l.flag+'</span><span>'+l.name+'</span>'; }
function renderList(f=""){
  f=f.trim().toLowerCase(); grid.textContent="";
  Object.entries(LANGS).filter(([c,l])=>c!=="bn" && (!f || (l.name+l.native+c).toLowerCase().includes(f))).forEach(([c,l])=>{
    const b=document.createElement("button"); b.setAttribute("aria-current",c===current);
    b.innerHTML='<span class="fl">'+l.flag+'</span><span>'+l.name+'<small>'+l.native+'</small></span>';
    b.onclick=()=>pick(c); grid.append(b);
  });
}
function openSheet(o){ sheet.classList.toggle("open",o); sbg.classList.toggle("open",o); if(o){ q.value=""; renderList(); setTimeout(()=>q.focus(),300); } }
function pick(c){ current=c; try{localStorage.setItem("lang",c);}catch(_){} if(active) active.rec.abort(); paintBtn(); openSheet(false); }
$("langBtn").onclick=()=>openSheet(true); sbg.onclick=()=>openSheet(false); q.oninput=()=>renderList(q.value);
addEventListener("keydown",e=>{ if(e.key==="Escape") openSheet(false); });
paintBtn();
</script>
</body>
